<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<title>Gluer Issue Alert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14; --card:#151a24; --card2:#1d2431; --line:#2a3344;
  --text:#f4f7fb; --dim:#98a3b8;
  --red:#ff3b3b; --yellow:#ffc21a; --green:#2ee66b; --blue:#3d8bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
#app{min-height:100%;display:flex;flex-direction:column;padding:14px;gap:14px;max-width:1400px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 16px}
.lamps{display:flex;gap:10px}
.lamp{width:46px;height:46px;border-radius:50%;background:#222a38;border:3px solid #323c50;transition:.2s}
.lamp.r.on{background:var(--red);border-color:#ff9a9a;box-shadow:0 0 28px 6px rgba(255,59,59,.65)}
.lamp.y.on{background:var(--yellow);border-color:#ffe28a;box-shadow:0 0 28px 6px rgba(255,194,26,.6)}
.lamp.g.on{background:var(--green);border-color:#9bffbc;box-shadow:0 0 28px 6px rgba(46,230,107,.55)}
.lamp.pulse{animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.35}}
.status{flex:1;min-width:0}
.status .s1{font-size:clamp(22px,3.6vw,36px);font-weight:900;line-height:1.1}
.status .s2{font-size:clamp(14px,2vw,19px);color:var(--dim);margin-top:2px;line-height:1.35}
.tbtn{background:var(--card2);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:18px;font-weight:700;min-height:56px;white-space:nowrap}
.tbtn.upd{border-color:var(--blue);color:#cfe1ff}

/* home */
.home{display:grid;grid-template-columns:1fr;gap:14px;flex:1}
@media (min-width:900px) and (orientation:landscape){.home.has-open{grid-template-columns:3fr 2fr}}
.issues{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-content:start}
@media (min-width:1000px){.issues{grid-template-columns:repeat(3,1fr)}}
.ibtn{background:var(--card);border:3px solid var(--line);border-radius:26px;min-height:200px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.ibtn .ic{font-size:54px;line-height:1}
.ibtn .en{font-size:clamp(26px,4vw,40px);font-weight:900;line-height:1.1}
.ibtn .es{font-size:clamp(17px,2.4vw,24px);color:#ffd6a0;font-weight:700}
.ibtn .my{font-size:clamp(18px,2.6vw,26px);color:#9fe6ff;font-weight:700;line-height:1.5}
.ibtn.other{grid-column:span 2}
@media (min-width:1000px){.ibtn.other{grid-column:span 3}}
.ibtn:active{background:var(--card2);border-color:var(--blue)}

.openwrap h2{margin:2px 4px 10px;font-size:20px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.ocard{display:flex;gap:0;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:12px;min-height:110px}
.ocard .bar{width:22px;flex:none}
.ocard .body{padding:12px 16px;flex:1;min-width:0}
.ocard .n{font-size:28px;font-weight:900;line-height:1.1}
.ocard .n2{font-size:18px;color:var(--dim);margin-top:2px}
.ocard .st{margin-top:6px;font-size:17px;font-weight:700}
.ocard .el{font-size:30px;font-weight:900;align-self:center;padding-right:16px;font-variant-numeric:tabular-nums}
.bar.red{background:var(--red)} .bar.yellow{background:var(--yellow)} .bar.green{background:var(--green)}
.ocard.red{border-color:var(--red)} .ocard.yellow{border-color:var(--yellow)}
.ocard.flash{animation:flash 1s infinite}
@keyframes flash{50%{background:#3a1218}}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--dim);padding:24px;border:2px dashed var(--line);border-radius:22px;font-size:20px;gap:4px}
.empty b{color:var(--green);font-size:26px}

/* sub screens */
.head{display:flex;align-items:center;gap:14px}
.back{background:var(--card2);border:2px solid var(--line);border-radius:18px;min-height:72px;min-width:150px;padding:0 20px;font-size:22px;font-weight:800;line-height:1.2}
.back small{display:block;font-size:14px;color:var(--dim);font-weight:600}
.titlebox{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;text-align:center}
.titlebox .en{font-size:clamp(34px,6vw,56px);font-weight:900;line-height:1.1}
.titlebox .es{font-size:clamp(20px,3.2vw,30px);color:#ffd6a0;font-weight:700;margin-top:4px}
.titlebox .my{font-size:clamp(22px,3.4vw,32px);color:#9fe6ff;font-weight:700;margin-top:4px;line-height:1.5}
.titlebox .ic{font-size:60px;line-height:1}

.colors{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.colors{grid-template-columns:1fr}}
.cbtn{border-radius:26px;min-height:230px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;border:6px solid transparent;color:#10131a}
.cbtn.red{background:var(--red)} .cbtn.yellow{background:var(--yellow)}
.cbtn .en{font-size:clamp(30px,5vw,48px);font-weight:900;line-height:1.05}
.cbtn .d{font-size:clamp(17px,2.4vw,23px);font-weight:700;line-height:1.35}
.cbtn.dim{opacity:.38}
.cbtn.sel{border-color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.25)}
.cbtn .chk{font-size:40px;height:44px}
.send{border-radius:26px;min-height:130px;font-size:clamp(32px,5vw,50px);font-weight:900;background:var(--blue);color:#fff;width:100%;line-height:1.15}
.send small{display:block;font-size:clamp(18px,2.6vw,26px);font-weight:700;opacity:.9}
.send[disabled]{background:#222a38;color:#667086;cursor:not-allowed}

/* detail */
.banner{border-radius:26px;padding:18px;text-align:center;color:#10131a}
.banner.red{background:var(--red)} .banner.yellow{background:var(--yellow)} .banner.green{background:var(--green)} .banner.gray{background:#556}
.banner .en{font-size:clamp(36px,7vw,64px);font-weight:900;line-height:1.05}
.banner .es,.banner .my{font-size:clamp(20px,3.4vw,32px);font-weight:800;margin-top:4px;line-height:1.5}
.banner .tag{display:inline-block;margin-top:8px;background:rgba(0,0,0,.22);color:#fff;border-radius:99px;padding:6px 18px;font-size:20px;font-weight:800}
.banner.flash{animation:bflash 1s infinite}
@keyframes bflash{50%{filter:brightness(.55)}}
.tl{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:6px 18px}
.trow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .dot{width:26px;height:26px;border-radius:50%;background:#2a3344;flex:none}
.trow.done .dot{background:var(--green)}
.trow .lbl{flex:1;font-size:22px;font-weight:800;line-height:1.25}
.trow .lbl small{display:block;font-size:15px;color:var(--dim);font-weight:600}
.trow .tm{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.trow .tm.none{color:#4a5468}
.bigact{border-radius:26px;min-height:150px;font-size:clamp(32px,5.4vw,54px);font-weight:900;width:100%;line-height:1.15}
.bigact small{display:block;font-size:clamp(18px,2.6vw,26px);font-weight:700;opacity:.92}
.bigact.ack{background:var(--blue);color:#fff}
.bigact.res{background:var(--green);color:#06210f}
.linkbtn{background:transparent;border:2px solid var(--line);border-radius:18px;min-height:64px;font-size:19px;font-weight:700;color:var(--dim);width:100%}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.sheet{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:22px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px;text-align:center}
.sheet h3{margin:0;font-size:clamp(28px,5vw,42px);line-height:1.15}
.sheet p{margin:0;color:var(--dim);font-size:20px;line-height:1.4}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .row button{min-height:110px;border-radius:20px;font-size:26px;font-weight:900;line-height:1.15}
.sheet .row button small{display:block;font-size:16px;font-weight:700;opacity:.9}
.yes{background:var(--green);color:#06210f} .no{background:var(--card2);border:2px solid var(--line)!important}
.danger{background:var(--red);color:#fff}

/* history */
.hcard{background:var(--card);border:2px solid var(--line);border-left:14px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:10px}
.hcard.red{border-left-color:var(--red)} .hcard.yellow{border-left-color:var(--yellow)}
.hcard .t{font-size:24px;font-weight:900}
.hcard .t span{font-size:16px;color:var(--dim);font-weight:600;margin-left:8px}
.hcard .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;font-size:16px;color:var(--dim)}
.hcard .g b{display:block;color:var(--text);font-size:20px;font-variant-numeric:tabular-nums}
.hcard .g i{display:block;font-style:normal;font-size:14px;color:#c8a24a}
.hbar{display:flex;gap:12px;flex-wrap:wrap}
.hbar .tbtn{flex:1;min-height:64px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#10131a;padding:16px 26px;border-radius:99px;font-size:22px;font-weight:800;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.ver{text-align:center;color:#4a5468;font-size:14px;padding:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>

<script>
const APP_VERSION = '1.0.0';
const STORE_KEY = 'gluerIssueAlert.v1';

/* ---------- text ---------- */
const TYPES = {
  fold:    {ic:'📃', en:'Fold Issue',     es:'Problema de Doblez',     my:'ခေါက်ခြင်း ပြဿနာ'},
  glue:    {ic:'💧', en:'Glue Issue',     es:'Problema de Pegamento',  my:'ကော် ပြဿနာ'},
  crack:   {ic:'⚡', en:'Cracking Issue', es:'Problema de Grietas',    my:'အက်ကွဲခြင်း ပြဿနာ'},
  burst:   {ic:'💥', en:'Bursting Issue', es:'Problema de Reventado',  my:'ပေါက်ကွဲခြင်း ပြဿနာ'},
  other:   {ic:'❓', en:'Other Issues',   es:'Otros Problemas',        my:'အခြား ပြဿနာများ'}
};
const URG = {
  red:    {en:'RED',    d:['Need help NOW','¡Necesito ayuda YA!','ချက်ချင်း အကူအညီလိုသည်'], tag:['Urgent','Urgente','အရေးပေါ်']},
  yellow: {en:'YELLOW', d:['Not critical – operator please look','No crítico – operador, por favor revise','အရေးမကြီးပါ – အော်ပရေတာ ကြည့်ပေးပါ'], tag:['Not critical','No crítico','အရေးမကြီး']}
};
const T = {
  allgood:['ALL GOOD','TODO BIEN','အားလုံး ကောင်းသည်'],
  waiting:['Waiting for operator','Esperando al operador','အော်ပရေတာကို စောင့်နေသည်'],
  acked:['Operator is on it','El operador está en ello','အော်ပရေတာ လုပ်ဆောင်နေသည်'],
  sent:['Sent','Enviado','ပို့ပြီး'],
  ack:['Operator confirmed','Operador confirmó','အော်ပရေတာ လက်ခံပြီး'],
  resolved:['Resolved','Resuelto','ဖြေရှင်းပြီး'],
  back:['Back','Atrás','နောက်သို့'],
  send:['SEND','ENVIAR','ပို့မည်'],
  confirm:['CONFIRM','CONFIRMAR','အတည်ပြုသည်'],
  fixed:['ISSUE RESOLVED','PROBLEMA RESUELTO','ပြဿနာ ဖြေရှင်းပြီး'],
  pickColor:['How urgent?','¿Qué tan urgente?','ဘယ်လောက် အရေးကြီးသနည်း']
};
const tri = k => `${T[k][0]}<small>${T[k][1]} · ${T[k][2]}</small>`;

/* ---------- state ---------- */
let issues = [];
try { issues = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e){ issues = []; }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(issues)); } catch(e){} };
let view = {name:'home'};          // home | color | detail | history
const $ = s => document.querySelector(s);
const isOpen = i => !i.resolvedAt && !i.cancelledAt;
const byId = id => issues.find(i => i.id === id);

/* ---------- helpers ---------- */
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'}) : '—';
const fmtDate = ts => new Date(ts).toLocaleDateString([], {month:'short',day:'numeric'});
const fmtDur = ms => {
  const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}:${String(x).padStart(2,'0')}`;
};
const nameBlock = (t, cls) => `<div class="en">${TYPES[t].en}</div><div class="es">${TYPES[t].es}</div><div class="my">${TYPES[t].my}</div>`;

function overall(){
  const open = issues.filter(isOpen);
  if (open.some(i => i.color === 'red')) return 'red';
  if (open.length) return 'yellow';
  return 'green';
}

function toast(msg){
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2600);
}

/* ---------- views ---------- */
function topbar(){
  const o = overall(), open = issues.filter(isOpen);
  const unacked = open.some(i => i.color === 'red' && !i.ackAt);
  const msg = o === 'green' ? [`${T.allgood[0]}`, `${T.allgood[1]} · ${T.allgood[2]}`]
    : [`${open.length} OPEN ISSUE${open.length>1?'S':''}`, o === 'red' ? 'URGENT · URGENTE · အရေးပေါ်' : 'ATTENTION · ATENCIÓN · အာရုံစိုက်ပါ'];
  return `<div class="top">
    <div class="lamps">
      <div class="lamp r ${o==='red'?'on':''} ${unacked?'pulse':''}"></div>
      <div class="lamp y ${o==='yellow'?'on':''}"></div>
      <div class="lamp g ${o==='green'?'on':''}"></div>
    </div>
    <div class="status"><div class="s1">${msg[0]}</div><div class="s2">${msg[1]}</div></div>
    <button class="tbtn" data-act="history">📋 Log</button>
    <button class="tbtn upd" data-act="update">⟳ Update</button>
  </div>`;
}

function statusLine(i){
  if (i.cancelledAt) return 'Cancelled';
  if (i.resolvedAt) return `✔ ${T.resolved[0]}`;
  if (i.ackAt) return `✔ ${T.acked[0]}`;
  return `⏳ ${T.waiting[0]}`;
}

function renderHome(){
  const open = issues.filter(isOpen).sort((a,b) => (a.color===b.color ? a.submittedAt-b.submittedAt : a.color==='red'?-1:1));
  const btns = Object.keys(TYPES).map(k => `
    <button class="ibtn ${k==='other'?'other':''}" data-act="pick" data-type="${k}">
      <div class="ic">${TYPES[k].ic}</div>${nameBlock(k)}
    </button>`).join('');
  const cards = open.map(i => `
    <button class="ocard ${i.color} ${i.color==='red'&&!i.ackAt?'flash':''}" data-act="open" data-id="${i.id}">
      <div class="bar ${i.color}"></div>
      <div class="body"><div class="n">${TYPES[i.type].en}</div><div class="n2">${TYPES[i.type].es}</div>
        <div class="st">${statusLine(i)}</div></div>
      <div class="el" data-since="${i.submittedAt}">${fmtDur(Date.now()-i.submittedAt)}</div>
    </button>`).join('');
  const side = open.length ? `<div class="openwrap"><h2>Open · Abiertos · ဖွင့်ထားသည်</h2>${cards}</div>` : '';
  return `${topbar()}
    <div class="home ${open.length?'has-open':''}">
      <div class="issues">${btns}</div>${side}
    </div><div class="ver">v${APP_VERSION}</div>`;
}

function renderColor(){
  const t = view.type, sel = view.color;
  const cb = c => `<button class="cbtn ${c} ${sel&&sel!==c?'dim':''} ${sel===c?'sel':''}" data-act="color" data-color="${c}">
      <div class="chk">${sel===c?'✔':''}</div>
      <div class="en">${URG[c].en}</div>
      ${URG[c].d.map(x=>`<div class="d">${x}</div>`).join('')}
    </button>`;
  return `<div class="head"><button class="back" data-act="home">← ${T.back[0]}<small>${T.back[1]} · ${T.back[2]}</small></button></div>
    <div class="titlebox"><div class="ic">${TYPES[t].ic}</div>${nameBlock(t)}</div>
    <div class="colors">${cb('red')}${cb('yellow')}</div>
    <button class="send" data-act="send" ${sel?'':'disabled'}>${tri('send')}</button>`;
}

function renderDetail(){
  const i = byId(view.id);
  if (!i) return renderHome();
  const done = !!i.resolvedAt, cancelled = !!i.cancelledAt;
  const cls = cancelled ? 'gray' : done ? 'green' : i.color;
  const tagText = cancelled ? 'Cancelled' : done ? `${T.resolved[0]} · ${T.resolved[1]} · ${T.resolved[2]}` : URG[i.color].tag.join(' · ');
  const row = (k, ts) => `<div class="trow ${ts?'done':''}"><div class="dot"></div>
      <div class="lbl">${T[k][0]}<small>${T[k][1]} · ${T[k][2]}</small></div>
      <div class="tm ${ts?'':'none'}">${fmtTime(ts)}</div></div>`;
  let action = '';
  if (!cancelled && !done){
    action = !i.ackAt
      ? `<button class="bigact ack" data-act="ack" data-id="${i.id}">${tri('confirm')}</button>`
      : `<button class="bigact res" data-act="askres" data-id="${i.id}">${tri('fixed')}</button>`;
    action += `<button class="linkbtn" data-act="askcancel" data-id="${i.id}">Sent by mistake? Cancel</button>`;
  }
  return `<div class="head"><button class="back" data-act="home">← ${T.back[0]}<small>${T.back[1]} · ${T.back[2]}</small></button>
      <div style="flex:1"></div>${!cancelled&&!done?`<div class="el" style="font-size:40px;font-weight:900" data-since="${i.submittedAt}">${fmtDur(Date.now()-i.submittedAt)}</div>`:''}</div>
    <div class="banner ${cls} ${(!cancelled&&!done&&i.color==='red'&&!i.ackAt)?'flash':''}">
      ${nameBlock(i.type)}<span class="tag">${tagText}</span></div>
    <div class="tl">${row('sent', i.submittedAt)}${row('ack', i.ackAt)}${row('resolved', i.resolvedAt)}</div>
    ${action}`;
}

function renderHistory(){
  const list = [...issues].sort((a,b) => b.submittedAt - a.submittedAt);
  const cards = list.map(i => {
    const resp = i.ackAt ? fmtDur(i.ackAt - i.submittedAt) : '—';
    const fix = i.resolvedAt ? fmtDur(i.resolvedAt - i.submittedAt) : '—';
    const st = i.cancelledAt ? 'Cancelled' : i.resolvedAt ? 'Resolved' : 'Open';
    return `<div class="hcard ${i.color}"><div class="t">${TYPES[i.type].en}<span>${i.color.toUpperCase()} · ${st} · ${fmtDate(i.submittedAt)}</span></div>
      <div class="g"><div>Sent<b>${fmtTime(i.submittedAt)}</b></div>
      <div>Acknowledged<b>${fmtTime(i.ackAt)}</b><i>response ${resp}</i></div>
      <div>Resolved<b>${fmtTime(i.resolvedAt)}</b><i>total ${fix}</i></div></div></div>`;
  }).join('') || '<div class="empty"><b>No issues logged yet</b>Nothing to show</div>';
  return `<div class="head"><button class="back" data-act="home">← ${T.back[0]}<small>${T.back[1]} · ${T.back[2]}</small></button>
      <div style="font-size:30px;font-weight:900">Issue Log</div></div>
    <div class="hbar"><button class="tbtn" data-act="csv">⬇ Download CSV</button><button class="tbtn" data-act="clearlog" style="color:#ff9a9a">🗑 Clear log</button></div>
    <div>${cards}</div><div class="ver">v${APP_VERSION}</div>`;
}

function render(){
  const v = view.name;
  $('#app').innerHTML = v==='color' ? renderColor() : v==='detail' ? renderDetail() : v==='history' ? renderHistory() : renderHome();
  window.scrollTo(0,0);
}

/* ---------- modal ---------- */
function modal(html){ $('#overlay').innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`; }
function closeModal(){ $('#overlay').innerHTML = ''; }

/* ---------- actions ---------- */
function exportCsv(){
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const iso = ts => ts ? new Date(ts).toLocaleString() : '';
  const rows = [['Issue','Urgency','Status','Sent','Acknowledged','Resolved','Response (min)','Total (min)']];
  [...issues].sort((a,b)=>a.submittedAt-b.submittedAt).forEach(i => rows.push([
    TYPES[i.type].en, i.color, i.cancelledAt?'cancelled':i.resolvedAt?'resolved':'open',
    iso(i.submittedAt), iso(i.ackAt), iso(i.resolvedAt),
    i.ackAt ? ((i.ackAt-i.submittedAt)/60000).toFixed(1) : '',
    i.resolvedAt ? ((i.resolvedAt-i.submittedAt)/60000).toFixed(1) : '']));
  const blob = new Blob([rows.map(r=>r.map(q).join(',')).join('\r\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'gluer-issue-log.csv'; document.body.appendChild(a); a.click(); a.remove();
}

async function updateApp(){
  toast('Checking for update…');
  try {
    const r = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    const latest = m ? m[1] : APP_VERSION;
    try { if ('caches' in window) (await caches.keys()).forEach(k => caches.delete(k)); } catch(e){}
    try { if (navigator.serviceWorker) (await navigator.serviceWorker.getRegistrations()).forEach(x => x.unregister()); } catch(e){}
    toast(latest !== APP_VERSION ? `Updating to v${latest}…` : 'Already latest ✔ Reloading');
    setTimeout(() => { location.href = location.pathname + '?v=' + Date.now(); }, 900);
  } catch(e){ toast('No internet – try again'); }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act){
    case 'home': view = {name:'home'}; render(); break;
    case 'history': view = {name:'history'}; render(); break;
    case 'update': updateApp(); break;
    case 'pick': view = {name:'color', type:b.dataset.type, color:null}; render(); break;
    case 'color': view.color = b.dataset.color; render(); break;
    case 'send':
      if (!view.color) return;
      issues.push({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), type:view.type, color:view.color, submittedAt:Date.now(), ackAt:null, resolvedAt:null, cancelledAt:null});
      save(); view = {name:'home'}; render(); toast('✔ Sent · Enviado · ပို့ပြီး'); break;
    case 'open': view = {name:'detail', id}; render(); break;
    case 'ack': { const i = byId(id); if (i && !i.ackAt){ i.ackAt = Date.now(); save(); render(); } break; }
    case 'askres':
      modal(`<h3>${T.fixed[0]}?</h3><p>${T.fixed[1]}? · ${T.fixed[2]}?<br>Is the problem really fixed?</p>
        <div class="row"><button class="no" data-act="closemodal">NOT YET<small>Todavía no · မပြီးသေးပါ</small></button>
        <button class="yes" data-act="res" data-id="${id}">YES, FIXED<small>Sí, resuelto · ဟုတ်ကဲ့ ပြီးပါပြီ</small></button></div>`); break;
    case 'res': { const i = byId(id); if (i && !i.resolvedAt){ i.resolvedAt = Date.now(); save(); } closeModal(); render(); toast('🟢 Resolved · Resuelto · ဖြေရှင်းပြီး'); break; }
    case 'askcancel':
      modal(`<h3>Cancel this issue?</h3><p>It was sent by mistake.<br>Enviado por error · မှားပို့မိသည်</p>
        <div class="row"><button class="no" data-act="closemodal">NO · KEEP<small>No · မဟုတ်ပါ</small></button>
        <button class="danger" data-act="cancel" data-id="${id}">YES, CANCEL<small>Sí, cancelar · ပယ်ဖျက်မည်</small></button></div>`); break;
    case 'cancel': { const i = byId(id); if (i && isOpen(i)){ i.cancelledAt = Date.now(); save(); } closeModal(); view = {name:'home'}; render(); break; }
    case 'closemodal': closeModal(); break;
    case 'csv': exportCsv(); break;
    case 'clearlog':
      modal(`<h3>Clear the whole log?</h3><p>This deletes all saved issues on this tablet. Download the CSV first if you need it.</p>
        <div class="row"><button class="no" data-act="closemodal">NO · KEEP</button><button class="danger" data-act="doclear">YES, CLEAR</button></div>`); break;
    case 'doclear': issues = []; save(); closeModal(); render(); break;
  }
});

/* live elapsed timers without re-rendering */
setInterval(() => {
  document.querySelectorAll('[data-since]').forEach(el => el.textContent = fmtDur(Date.now() - Number(el.dataset.since)));
}, 1000);

/* keep the tablet screen awake */
let wl = null;
async function keepAwake(){ try { if (navigator.wakeLock && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch(e){} }
document.addEventListener('pointerdown', keepAwake, {passive:true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

render();
</script>
</body>
</html>
