<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gluer Alert">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gluer Issue Alert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* Everything is sized from --vu (one "view unit") so the whole app scales to the screen and fits without scrolling. */
:root{
  --vu:min(1vh,1.8vw);
  --g:calc(var(--vu)*1.5);
  --bg:#0b0e14; --card:#151a24; --card2:#1d2431; --line:#2a3344;
  --text:#f4f7fb; --dim:#98a3b8;
  --red:#ff3b3b; --yellow:#ffc21a; --green:#2ee66b; --blue:#3d8bff; --orange:#ff8a2a;
  --hot:#ff2323; --esc:#ffd6a0; --myc:#9fe6ff;
}
@supports (height:1dvh){:root{--vu:min(1dvh,1.8vw)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Myanmar Text","Padauk",sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.98)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:var(--g);padding:var(--g)}
#app > *{min-width:0}

/* three-language block: Spanish + Burmese BIG, English smaller */
.lg{--u:calc(var(--vu)*3.4);display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.15;max-width:100%;min-width:0}
.lg.left{align-items:flex-start;text-align:left}
.lg .es,.lg .my{font-weight:900;font-size:var(--u);overflow-wrap:anywhere}
.lg .es{color:var(--esc)} .lg .my{color:var(--myc);line-height:1.45}
.lg .en{font-style:normal;font-weight:800;font-size:calc(var(--u)*.78);opacity:1;color:#fff}
.lg.xl{--u:calc(var(--vu)*4.6)}
.banner .lg.xl{--u:calc(var(--vu)*3.9)}
.lg.md{--u:calc(var(--vu)*3)}
.lg.sm{--u:calc(var(--vu)*2.4)}
.lg.inline{--u:calc(var(--vu)*2.5);flex-direction:row;flex-wrap:wrap;align-items:baseline;justify-content:flex-start;text-align:left;gap:0 calc(var(--vu)*1.2)}
.bigact,.send,.cbtn,.banner,.yes,.danger,.rbtn.sel,.u{--esc:currentColor;--myc:currentColor}

/* button text scales with each button's own size (container units) */
.ibtn,.cbtn,.rbtn,.bigact,.send{container-type:size}
.ibtn .lg{--u:min(10.5cqw,10.5cqh)}
.ibtn .ic{font-size:min(20cqh,17cqw);line-height:1}
.cbtn .lg{--u:min(7cqw,9cqh)}
.rbtn .lg{--u:min(10cqw,13cqh)}
.bigact .lg{--u:min(8cqw,15cqh)}
.send .lg{--u:min(7cqw,16cqh)}

/* top bar */
.top{flex:none;display:flex;align-items:center;gap:calc(var(--vu)*1.6);background:var(--card);border:2px solid var(--line);border-radius:calc(var(--vu)*2.4);padding:calc(var(--vu)*1.1) calc(var(--vu)*1.6)}
.lamps{display:flex;gap:calc(var(--vu)*1.1)}
.lamp{width:calc(var(--vu)*5);height:calc(var(--vu)*5);border-radius:50%;background:#222a38;border:3px solid #323c50;transition:.2s}
.lamp.r.on{background:var(--red);border-color:#ff9a9a;box-shadow:0 0 28px 6px rgba(255,59,59,.65)}
.lamp.y.on{background:var(--yellow);border-color:#ffe28a;box-shadow:0 0 28px 6px rgba(255,194,26,.6)}
.lamp.b.on{background:var(--blue);border-color:#a8cbff;box-shadow:0 0 28px 6px rgba(61,139,255,.65)}
.lamp.g.on{background:var(--green);border-color:#9bffbc;box-shadow:0 0 28px 6px rgba(46,230,107,.55)}
.lamp.pulse{animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.35}}
.status{flex:1;min-width:0}
@media (min-width:700px){.status .lg.inline{--u:calc(var(--vu)*3.2)}}
.status .cnt{font-size:calc(var(--vu)*2.6);color:var(--hot);font-weight:900;letter-spacing:.02em;line-height:1.1;text-shadow:0 0 14px rgba(255,35,35,.45)}
.status .cnt b{font-size:calc(var(--vu)*4.6);font-weight:900;line-height:1}
.tbtn{background:var(--card2);border:2px solid var(--line);border-radius:calc(var(--vu)*2);padding:0 calc(var(--vu)*2);font-size:calc(var(--vu)*2.6);font-weight:800;min-height:calc(var(--vu)*7.5);white-space:nowrap}
.tbtn.upd{border-color:var(--blue);color:#cfe1ff}

/* home */
.home{flex:1;min-height:0;display:grid;gap:var(--g);grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.home:not(.has-open){grid-template-rows:minmax(0,1fr)}
.openwrap{order:-1;max-height:42vh;max-height:42dvh;overflow-y:auto;min-height:0}
@media (max-height:720px){.openwrap h2{display:none}.openwrap{max-height:41dvh}.trow .tm{font-size:calc(var(--vu)*2.6)}}
@media (max-height:720px) and (orientation:portrait){.banner .en,.turn .en,.ocard .en{display:none}}
.openwrap h2{margin:0 4px calc(var(--vu)*.8);font-size:calc(var(--vu)*1.9);color:var(--dim);letter-spacing:.05em;text-transform:uppercase}
.issues{min-height:0;display:grid;gap:var(--g);grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.ibtn{background:var(--card);border:3px solid var(--line);border-radius:calc(var(--vu)*3);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--vu)*.6);text-align:center}
.ibtn.other{grid-column:span 2}
.ibtn:active{background:var(--card2);border-color:var(--blue)}
@media (orientation:landscape) and (min-width:800px){
  .issues{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
  .home.has-open{grid-template-columns:minmax(0,3fr) minmax(0,2fr);grid-template-rows:minmax(0,1fr)}
  .openwrap{order:0;max-height:none}
}
.ocard{display:flex;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:calc(var(--vu)*2.4);overflow:hidden;margin-bottom:var(--g)}
.ocard .bar{width:calc(var(--vu)*2.4);flex:none}
.ocard .body{padding:calc(var(--vu)*.9) calc(var(--vu)*1.6);justify-content:center;flex:1;min-width:0;display:flex;flex-direction:column;gap:calc(var(--vu)*.7)}
.ocard .lg.inline{--u:calc(var(--vu)*2.8)}
.ocard .meta{display:flex;align-items:center;gap:calc(var(--vu)*1.2);flex-wrap:wrap}
.ocard .st{font-size:calc(var(--vu)*2);font-weight:700;color:var(--dim)}
.ocard .cf{font-size:calc(var(--vu)*2.2);font-weight:900;color:var(--orange)}
.who{display:inline-flex;align-self:flex-start;align-items:baseline;gap:0 calc(var(--vu)*1.2);flex-wrap:wrap;border-radius:99px;padding:calc(var(--vu)*.5) calc(var(--vu)*1.8);font-weight:900;font-size:calc(var(--vu)*2.8);line-height:1.2}
.who small{font-size:calc(var(--vu)*2);font-weight:800;opacity:.95}
.who.op{background:#fff;color:#10131a}
.who.pk{background:var(--blue);color:#fff}
.ocard .right{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:calc(var(--vu)*.5);padding-right:calc(var(--vu)*1.6)}
.ocard .el{font-size:calc(var(--vu)*5.4);color:var(--hot);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.ocard .st{font-size:calc(var(--vu)*2.6)}
.bar.red{background:var(--red)} .bar.yellow{background:var(--yellow)} .bar.green{background:var(--green)} .bar.blue{background:var(--blue)}
.ocard.red{border-color:var(--red)} .ocard.yellow{border-color:var(--yellow)} .ocard.blue{border-color:var(--blue)}
.u{display:inline-block;font-size:calc(var(--vu)*1.8);font-weight:800;border-radius:99px;padding:1px calc(var(--vu)*1.2);color:#10131a}
.u.red{background:var(--red);color:#fff} .u.yellow{background:var(--yellow)}
.ocard.flash{animation:flash 1s infinite}
.ocard.flashb{animation:flashb 1s infinite}
@keyframes flash{50%{background:#3a1218}}
@keyframes flashb{50%{background:#10244a}}

/* sub screens */
.head{flex:none;display:flex;align-items:center;gap:calc(var(--vu)*1.6)}
.back{background:var(--card2);border:2px solid var(--line);border-radius:calc(var(--vu)*2.2);min-height:calc(var(--vu)*8.5);min-width:calc(var(--vu)*17);padding:0 calc(var(--vu)*2)}
.head .title{font-size:calc(var(--vu)*4);font-weight:900}
.head .el{font-size:calc(var(--vu)*6.5);color:var(--hot);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.titlebox{flex:none;background:var(--card);border:3px solid var(--line);border-radius:calc(var(--vu)*2.4);padding:calc(var(--vu)*1.2);display:flex;align-items:center;justify-content:center;gap:calc(var(--vu)*2.5)}
.titlebox .ic{font-size:calc(var(--vu)*7);line-height:1}
.titlebox .sub{color:var(--dim);font-size:calc(var(--vu)*2.2);font-weight:700;margin-top:2px}

.colors{flex:1;min-height:0;display:grid;gap:var(--g);grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr)}
@media (orientation:portrait){.colors{grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}}
.cbtn{position:relative;border-radius:calc(var(--vu)*3);padding:0 3%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid transparent;color:#10131a}
.cbtn.red{background:var(--red)} .cbtn.yellow{background:var(--yellow)}
.cbtn.dim{opacity:.38}
.cbtn.sel{border-color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.25)}
.cbtn .chk{position:absolute;top:6px;right:14px;font-size:calc(var(--vu)*5);font-weight:900}
.send{flex:none;height:calc(var(--vu)*15);border-radius:calc(var(--vu)*3);background:var(--blue);color:#fff;width:100%;display:flex;align-items:center;justify-content:center}
.send[disabled]{background:#222a38;color:#667086;cursor:not-allowed}

/* detail */
.dgrid{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--g)}
.banner{flex:none;border-radius:calc(var(--vu)*3);padding:calc(var(--vu)*1.5);text-align:center;color:#10131a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--vu)*1)}
.banner.red{background:var(--red)} .banner.yellow{background:var(--yellow)} .banner.green{background:var(--green)} .banner.gray{background:#556} .banner.blue{background:var(--blue);color:#fff}
.banner .badges{display:flex;flex-wrap:wrap;gap:calc(var(--vu)*.8);justify-content:center}
.banner .tag{background:rgba(0,0,0,.22);color:#fff;border-radius:99px;padding:calc(var(--vu)*.5) calc(var(--vu)*2);font-size:calc(var(--vu)*2.2);font-weight:800}
.banner .cfb{background:var(--orange);color:#1c0e00;border-radius:calc(var(--vu)*2);padding:calc(var(--vu)*.7) calc(var(--vu)*2);font-size:calc(var(--vu)*2.6);font-weight:900}
.banner.flash{animation:bflash 1s infinite}
@keyframes bflash{50%{filter:brightness(.55)}}
.dr{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--g)}
.turn{flex:none;border:3px solid var(--blue);border-radius:calc(var(--vu)*2.2);padding:calc(var(--vu)*1) calc(var(--vu)*1.6);background:#0f1d38;display:flex;justify-content:center}
.bigact{flex:1;min-height:0;border-radius:calc(var(--vu)*3);width:100%;display:flex;align-items:center;justify-content:center;padding:0 2%}
.bigact.ack{background:var(--blue);color:#fff}
.bigact.res{background:var(--green);color:#06210f}
.bigact.cant{background:var(--orange);color:#1c0e00}
.pair{flex:1;min-height:0;display:grid;gap:var(--g);grid-template-columns:minmax(0,1fr);grid-template-rows:repeat(2,minmax(0,1fr))}
.linkbtn{background:transparent;border:2px solid var(--line);border-radius:calc(var(--vu)*2.2);min-height:calc(var(--vu)*8.5);padding:0 calc(var(--vu)*2);font-size:calc(var(--vu)*2.4);font-weight:700;color:var(--dim)}
.tl{flex:none;background:var(--card);border:2px solid var(--line);border-radius:calc(var(--vu)*2.4);padding:calc(var(--vu)*.4) calc(var(--vu)*1.8)}
.trow{display:flex;align-items:center;gap:calc(var(--vu)*1.6);padding:calc(var(--vu)*.7) 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .dot{width:calc(var(--vu)*2.8);height:calc(var(--vu)*2.8);border-radius:50%;background:#2a3344;flex:none}
.trow.done .dot{background:var(--green)}
.trow.cf.done .dot{background:var(--orange)}
.trow .lbl{flex:1;min-width:0}
.trow .lbl .why{color:var(--orange);font-weight:800;font-size:calc(var(--vu)*2);margin-top:2px}
.trow .tm{font-size:calc(var(--vu)*3);font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .tm.none{color:#4a5468}
@media (orientation:landscape) and (min-width:800px){
  .dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"b r" "t r"}
  .dgrid .banner{grid-area:b}
  .dgrid .tl{grid-area:t}
  .dgrid .dr{grid-area:r}
}

@media (max-height:720px) and (orientation:portrait){.dr .turn{display:none}.trow:not(.done){display:none}}
@media (orientation:portrait) and (max-height:1100px){.trow:not(.done){display:none}.trow .en{display:none}}
@media (orientation:portrait) and (min-width:600px){.pair{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}}
@media (max-width:600px){.who small{display:none}.who{font-size:calc(var(--vu)*2.1);padding:calc(var(--vu)*.3) calc(var(--vu)*1.4)}.ocard .lg.inline{--u:calc(var(--vu)*2.4)}}
@media (max-width:900px) and (orientation:portrait),(max-width:600px){.top{flex-wrap:wrap;row-gap:calc(var(--vu)*.6)}.lamps{margin-right:auto}.status{order:3;flex:1 0 100%;display:flex;align-items:baseline;flex-wrap:wrap;gap:0 calc(var(--vu)*1.5)}.status .cnt{font-size:calc(var(--vu)*2.4)}.status .cnt b{font-size:calc(var(--vu)*3.6)}}
@media (max-width:600px){.tbtn .tx,.linkbtn .tx{display:none}.tbtn{padding:0 calc(var(--vu)*2.2)}}
/* can't-fix reasons */
.reasons{flex:1;min-height:0;display:grid;gap:var(--g);grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.rbtn{background:var(--card);border:4px solid var(--line);border-radius:calc(var(--vu)*3);padding:0 3%;display:flex;align-items:center;justify-content:center}
.rbtn.sel{background:var(--orange);color:#1c0e00;border-color:#fff}
.rbtn.dim{opacity:.4}
textarea{flex:none;width:100%;height:calc(var(--vu)*13);border-radius:calc(var(--vu)*2.2);border:3px solid var(--orange);background:#10151f;color:var(--text);font:inherit;font-size:calc(var(--vu)*3.2);padding:calc(var(--vu)*1.2);resize:none}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:var(--g);z-index:50}
.sheet{background:var(--card);border:3px solid var(--line);border-radius:calc(var(--vu)*3);padding:calc(var(--vu)*2);width:100%;max-width:min(860px,100%);max-height:96vh;max-height:96dvh;display:flex;flex-direction:column;gap:var(--g);text-align:center;align-items:stretch;justify-content:center}
.sheet .sub{color:var(--dim);font-size:calc(var(--vu)*2.4)}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:var(--g)}
.sheet .row button{height:calc(var(--vu)*22);border-radius:calc(var(--vu)*2.4);display:flex;align-items:center;justify-content:center;padding:4px}
.sheet .big{font-size:calc(var(--vu)*4);font-weight:900}
.yes{background:var(--green);color:#06210f} .no{background:var(--card2);border:2px solid var(--line)!important}
.danger{background:var(--red);color:#fff}

/* log: the only screen that may scroll (it is a long list) */
.hist{flex:1;min-height:0;overflow-y:auto}
.hcard{background:var(--card);border:2px solid var(--line);border-left:14px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:10px}
.hcard.red{border-left-color:var(--red)} .hcard.yellow{border-left-color:var(--yellow)}
.hcard .t{font-size:calc(var(--vu)*3);font-weight:900}
.hcard .t span{font-size:calc(var(--vu)*2);color:var(--dim);font-weight:600;margin-left:8px}
.hcard .cfl{color:var(--orange);font-weight:800;font-size:calc(var(--vu)*2.2);margin-top:4px}
.hcard .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px;font-size:calc(var(--vu)*2);color:var(--dim)}
.hcard .g b{display:block;color:var(--text);font-size:calc(var(--vu)*2.6);font-variant-numeric:tabular-nums}
.hcard .g i{display:block;font-style:normal;font-size:calc(var(--vu)*1.8);color:#c8a24a}
.hbar{flex:none;display:flex;gap:12px}
.hbar .tbtn{flex:1}
.empty{padding:24px;text-align:center;color:var(--dim);font-size:calc(var(--vu)*2.8);border:2px dashed var(--line);border-radius:22px}

.toast{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);background:#fff;color:#10131a;padding:calc(var(--vu)*1.8) calc(var(--vu)*3);border-radius:99px;font-size:calc(var(--vu)*2.8);font-weight:800;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:92vw;text-align:center}
.ver{position:fixed;right:10px;bottom:4px;color:#4a5468;font-size:12px;pointer-events:none}
.lamp.cop.r.on{animation:copR .6s steps(1) infinite}
.lamp.cop.b.on{animation:copB .6s steps(1) infinite}
@keyframes copR{0%{opacity:1}50%{opacity:.12}}
@keyframes copB{0%{opacity:.12}50%{opacity:1}}
.top.cop{animation:copTop .6s steps(1) infinite}
@keyframes copTop{0%{border-color:var(--red);box-shadow:0 0 30px 4px rgba(255,59,59,.7)}50%{border-color:var(--blue);box-shadow:0 0 30px 4px rgba(61,139,255,.8)}}
.banner.cop{color:#fff;animation:copBg .6s steps(1) infinite}
@keyframes copBg{0%{background:var(--red)}50%{background:var(--blue)}}
.ocard.cop{animation:copCard .6s steps(1) infinite}
@keyframes copCard{0%{border-color:var(--red);background:#3a1218}50%{border-color:var(--blue);background:#10244a}}
.bar.cop{background:linear-gradient(var(--red) 50%,var(--blue) 50%)}
.who.qa{background:linear-gradient(90deg,var(--red),var(--blue));color:#fff}
.banner.nope{background:#b03030;color:#fff}
.linkbtn.wide{width:100%;flex:none}
.bigact.esc{background:var(--orange);color:#1c0e00}
.bigact.no{background:var(--red);color:#fff}
.trow .why.qa-ok{color:var(--green)} .trow .why.qa-no{color:var(--red)}
@media (orientation:portrait){.banner .cfb{display:none}.who{font-size:calc(var(--vu)*2.2);flex-wrap:nowrap;white-space:nowrap}.who small{display:none}}
.linkbtn.wide{min-height:calc(var(--vu)*6.5)}

/* ===== polish: clean cards, futuristic icons ===== */
html{background:var(--bg)}
body{background:radial-gradient(120% 80% at 50% -10%,#121b2e 0%,var(--bg) 62%) fixed}
.ibtn,.ocard,.top,.tl,.titlebox,.rbtn:not(.sel){background:linear-gradient(180deg,#182131,#121824)}
.ocard{padding:0}
.send{padding:0 2%}
.ico{width:1em;height:1em;flex:none;display:inline-block;vertical-align:-.16em;overflow:visible}
.ibtn .ic,.titlebox .ic{display:grid;place-items:center;border-radius:30%;background:linear-gradient(150deg,rgba(109,243,255,.15),rgba(122,139,255,.08));border:1.5px solid rgba(122,170,255,.3);box-shadow:inset 0 0 18px rgba(109,243,255,.07),0 0 22px rgba(109,243,255,.06)}
.ibtn .ic{width:min(27cqh,22cqw);height:min(27cqh,22cqw);font-size:0}
.ibtn .ic .ico,.titlebox .ic .ico{width:66%;height:66%;filter:drop-shadow(0 0 5px rgba(109,243,255,.5))}
.titlebox .ic{width:calc(var(--vu)*8.5);height:calc(var(--vu)*8.5);font-size:0}
.rbtn{flex-direction:column;gap:calc(var(--vu)*.8)}
.rbtn .ico{width:min(30cqh,26cqw);height:min(30cqh,26cqw);filter:drop-shadow(0 0 5px rgba(109,243,255,.4))}
.rbtn .lg{--u:min(9cqw,9.5cqh)}
.rbtn.sel .ico,.rbtn.sel .ico [stroke]{stroke:#1c0e00;filter:none}

const TS = {rejected:['Not fixed','No arreglado','မပြင်ရသေး'], escalated:['Escalated','Escalado','တင်ပြပြီး'], qa:['QA / Manager','QA / Gerente','QA / မန်နေဂျာ'], sent:['Sent','Enviado','ပို့ပြီး'], ack:['Operator in','Operador listo','အော်ပရေတာ လက်ခံ'], cantfixed:["Can't fix",'No se puede','ပြင်မရ'], opfixed:['Op. fixed','Arreglado','ပြင်ပြီး'], resolved:['Packers OK','Empacadores OK','ထုပ်ပိုးသူ OK']};

const ico = (n, cls='') => {
  const cc = cls.includes('cc');
  const inner = cc ? IC[n].split('url(#ia)').join('currentColor') : IC[n];
  return '<svg class="ico ' + cls + '" viewBox="0 0 48 48" fill="none" stroke="' + (cc ? 'currentColor' : 'url(#ig)') + '" stroke-width="' + (cc ? 3 : 2.4) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
};
const lg = (a, cls='') => `<div class="lg ${cls}"><span class="es">${a[1]}</span><span class="my">${a[2]}</span><i class="en">${a[0]}</i></div>`;

/* ---------- state ---------- */
let issues = [];
try { issues = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e){ issues = []; }
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(issues)); } catch(e){} };
let view = {name:'home'};          // home | color | detail | cant | history
const $ = s => document.querySelector(s);
const isOpen = i => !i.resolvedAt && !i.cancelledAt && !i.qaAt;
const isEsc = i => i.escalatedAt && !i.qaAt;
const byId = id => issues.find(i => i.id === id);

/* ---------- helpers ---------- */
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'}) : '—';
const fmtHM = ts => new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtDate = ts => new Date(ts).toLocaleDateString([], {month:'short',day:'numeric'});
const fmtDur = ms => {
  const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return h ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}:${String(x).padStart(2,'0')}`;
};
const cfText = i => i.cantFixReason ? (i.cantFixReason === 'other' && i.cantFixNote ? `Other: ${i.cantFixNote}` : REASONS[i.cantFixReason].t[0]) : '';
const hasCF = i => i.cantFixAt && !i.opResolvedAt;

/* light priority: escalated (police flash) > unacknowledged red > unacknowledged yellow > blue (operator confirmed, not yet closed by packers) > green */
function overall(){
  const open = issues.filter(isOpen);
  if (open.some(isEsc)) return 'cop';
  if (open.some(i => !i.ackAt && i.color === 'red')) return 'red';
  if (open.some(i => !i.ackAt)) return 'yellow';
  if (open.length) return 'blue';
  return 'green';
}
const cardColor = i => isEsc(i) ? 'cop' : i.ackAt ? 'blue' : i.color;

function toast(msg){
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2800);
}

/* ---------- views ---------- */
function topbar(){
  const o = overall(), open = issues.filter(isOpen);
  const needPack = open.some(i => i.opResolvedAt);
  const n = open.length;
  const sub = o === 'green' ? T.allgood
    : o === 'cop' ? ['QA / MANAGER NEEDED','QA / GERENTE','QA / မန်နေဂျာ']
    : o === 'red' ? ['URGENT','URGENTE','အရေးပေါ်']
    : o === 'yellow' ? ['ATTENTION','ATENCIÓN','အာရုံစိုက်ပါ']
    : needPack ? ['PACKERS: CONFIRM','EMPACADORES: CONFIRMEN','ထုပ်ပိုးသူများ – အတည်ပြုပါ']
    : ['OPERATOR WORKING','OPERADOR TRABAJANDO','အော်ပရေတာ လုပ်ဆောင်နေသည်'];
  return `<div class="top ${o==='cop'?'cop':''}">
    <div class="lamps">
      <div class="lamp r ${o==='red'?'on pulse':''} ${o==='cop'?'on cop':''}"></div>
      <div class="lamp y ${o==='yellow'?'on':''}"></div>
      <div class="lamp b ${o==='blue'?'on':''} ${o==='blue'&&needPack?'pulse':''} ${o==='cop'?'on cop':''}"></div>
      <div class="lamp g ${o==='green'?'on':''}"></div>
    </div>
    <div class="status">${n?`<div class="cnt"><b>${n}</b> OPEN · <b>${n}</b> ABIERTO${n>1?'S':''}</div>`:''}${lg(sub,'inline xl2')}</div>
    <button class="tbtn" data-act="history">${ico('log','cc')}<span class="tx">Log</span></button>
    <button class="tbtn upd" data-act="update">${ico('refresh','cc')}<span class="tx">Update</span></button>
  </div>`;
}

const WHO = {op:['OPERATOR','OPERADOR','အော်ပရေတာ'], pk:['PACKERS','EMPACADORES','ထုပ်ပိုးသူများ'], qa:['QA / MANAGER','QA / GERENTE','QA / မန်နေဂျာ']};
const whoTag = i => { const k = isEsc(i) ? 'qa' : (i.opResolvedAt || i.cantFixAt) ? 'pk' : 'op'; const w = WHO[k]; return `<span class="who ${k}">${ico('arrow','cc')}<span class="wt"><span>${w[1]}</span><span>${w[2]}</span></span><small>${w[0]}</small></span>`; };
const statusEmoji = i => { const k = isEsc(i) ? ['siren','siren'] : (i.opResolvedAt || i.cantFixAt) ? ['checkc','check'] : i.ackAt ? ['wrench','wrench'] : ['clock','clock']; return ico(k[0],'cc s-'+k[1]); };
function statusLine(i){
  if (i.opResolvedAt) return T.waitpack[1];
  if (i.ackAt) return T.acked[1];
  return T.waiting[1];
}

function renderHome(){
  const open = issues.filter(isOpen).sort((a,b) => (a.color===b.color ? a.submittedAt-b.submittedAt : a.color==='red'?-1:1));
  const btns = Object.keys(TYPES).map(k => `
    <button class="ibtn t-${k} ${k==='other'?'other':''}" data-act="pick" data-type="${k}">
      <div class="ibi"><div class="ic">${ico(TYPES[k].ic)}</div>${lg(TYPES[k].t)}</div>
    </button>`).join('');
  const cards = open.map(i => `
    <button class="ocard ${cardColor(i)} ${i.color==='red'&&!i.ackAt?'flash':''} ${(i.opResolvedAt||(i.cantFixAt&&!isEsc(i)))?'flashb':''}" data-act="open" data-id="${i.id}">
      <div class="oi">
        <div class="r1">${lg(TYPES[i.type].t,'inline')}<div class="el"><small>${T.sent[1]} · ${T.sent[0]}</small>${fmtHM(i.submittedAt)}</div></div>
        <div class="r2">${whoTag(i)}</div>
        <div class="r3"><span class="u ${i.color}">${URG[i.color].en}</span><span class="st">${statusEmoji(i)}</span>${(i.attempts&&i.attempts.length)?`<span class="u retry">${ico('undo','cc')}${i.attempts.length+1}</span>`:''}</div>
        ${i.cantFixAt&&!i.opResolvedAt?`<div class="cf">${ico('warn','cc')} ${T.cant[0]} · ${cfText(i)}</div>`:''}
      </div>
    </button>`).join('');
  const side = open.length ? `<div class="openwrap"><h2>Open · Abiertos · ဖွင့်ထားသည်</h2>${cards}</div>` : '';
  return `${topbar()}
    <div class="home ${open.length?'has-open':''}">
      <div class="issues">${btns}</div>${side}
    </div>`;
}

const backBtn = () => `<button class="back" data-act="home">${ico('chev','cc')}${lg(T.back,'sm')}</button>`;

function renderColor(){
  const t = view.type, sel = view.color;
  const cb = c => `<button class="cbtn ${c} ${sel&&sel!==c?'dim':''} ${sel===c?'sel':''}" data-act="color" data-color="${c}">
      <span class="chk">${sel===c?ico('check','cc'):''}</span>${lg(URG[c].d)}
    </button>`;
  return `<div class="head">${backBtn()}</div>
    <div class="titlebox t-${t}"><div class="ic">${ico(TYPES[t].ic)}</div>${lg(TYPES[t].t,'md')}</div>
    <div class="colors">${cb('red')}${cb('yellow')}</div>
    <button class="send" data-act="send" ${sel?'':'disabled'}>${lg(T.send)}</button>`;
}

function renderCant(){
  const i = byId(view.id); if (!i) return renderHome();
  const r = view.reason;
  const rb = k => `<button class="rbtn ${r===k?'sel':''} ${r&&r!==k?'dim':''}" data-act="reason" data-r="${k}">${ico(REASONS[k].ic)}${lg(REASONS[k].t)}</button>`;
  const note = r === 'other' ? `<textarea id="note" placeholder="${T.typeit[0]} / ${T.typeit[1]} / ${T.typeit[2]}">${view.note||''}</textarea>` : '';
  return `<div class="head"><button class="back" data-act="open" data-id="${i.id}">${ico('chev','cc')}${lg(T.back,'sm')}</button></div>
    <div class="titlebox"><div>${lg(T.why,'md')}<div class="sub">${TYPES[i.type].t[0]}</div></div></div>
    <div class="reasons">${rb('die')}${rb('paper')}${rb('cad')}${rb('other')}</div>
    ${note}
    <button class="send" data-act="sendcant" ${r?'':'disabled'} style="${r?'--depth:#a24d0a;background:linear-gradient(180deg,#ffa857,#f07410);color:#1c0e00':''}">${lg(T.confirm)}</button>`;
}

function renderDetail(){
  const i = byId(view.id);
  if (!i) return renderHome();
  const done = !!(i.resolvedAt || i.qaAt), cancelled = !!i.cancelledAt, esc = isEsc(i);
  const cls = cancelled ? 'gray' : i.qaAt ? (i.qaDecision === 'approved' ? 'green' : 'nope') : done ? 'green' : cardColor(i);
  const tagText = cancelled ? 'Cancelled' : i.qaAt ? `QA: ${T[i.qaDecision === 'approved' ? 'approved' : 'notapproved'].join(' · ')}` : done ? 'Resolved · Resuelto · ဖြေရှင်းပြီး' : esc ? T.escwait[0] : `${URG[i.color].en} · ${URG[i.color].tag.join(' · ')}`;
  const row = (k, ts, extra='', cfRow=false) => `<div class="trow ${ts?'done':''} ${cfRow?'cf':''}"><div class="dot"></div>
      <div class="lbl">${lg(TS[k],'inline')}${extra}</div>
      <div class="tm ${ts?'':'none'}">${fmtTime(ts)}</div></div>`;
  let action = '';
  if (!cancelled && !done){
    const stage = esc ? 'qa' : !i.ackAt ? 0 : i.opResolvedAt ? 2 : i.cantFixAt ? 'cf' : 1;
    const tk = stage === 'qa' ? 'turnqa' : stage === 'cf' ? 'turncf' : 'turn'+stage;
    action = `<div class="turn">${lg(T[tk],'md')}</div>` + (stage === 'qa'
      ? `<div class="pair"><button class="bigact res" data-act="askqa" data-d="approved" data-id="${i.id}">${lg(T.approved)}</button>
         <button class="bigact no" data-act="askqa" data-d="rejected" data-id="${i.id}">${lg(T.notapproved)}</button></div>`
      : stage === 'cf'
      ? `<button class="bigact esc" data-act="askesc" data-id="${i.id}">${lg(T.escal)}</button>
         <button class="linkbtn wide" data-act="retry" data-id="${i.id}">${ico('undo','cc')}${T.retry[1]} · ${T.retry[2]}</button>`
      : stage === 0
      ? `<button class="bigact ack" data-act="ack" data-id="${i.id}">${lg(T.confirm)}</button>`
      : stage === 1
      ? `<div class="pair"><button class="bigact res" data-act="askop" data-id="${i.id}">${lg(T.fixed)}</button>
         <button class="bigact cant" data-act="cantfix" data-id="${i.id}">${lg(T.cant)}</button></div>`
      : `<div class="pair"><button class="bigact res" data-act="askres" data-id="${i.id}">${lg(T.pconfirm)}</button>
         <button class="bigact no" data-act="asknot" data-id="${i.id}">${lg(T.notfixed)}</button></div>`);
  }
  const cfBadge = i.cantFixAt && !i.opResolvedAt && !done ? `<div class="cfb">${ico('warn','cc')} ${T.cant[0]} · ${cfText(i)}</div>` : '';
  const cfRow = i.cantFixAt ? row('cantfixed', i.cantFixAt, `<div class="why">${cfText(i)}</div>`, true) : '';
  return `<div class="head">${backBtn()}
      <div style="flex:1"></div>${!cancelled&&!done?`<button class="linkbtn" data-act="askcancel" data-id="${i.id}">${ico('x','cc')}<span class="tx">Cancel</span></button>`:''}${!cancelled&&!done?`<div class="el"><small>${T.sent[1]} · ${T.sent[0]}</small>${fmtHM(i.submittedAt)}</div>`:''}</div>
    <div class="dgrid">
      <div class="banner ${cls} ${(!cancelled&&!done&&i.color==='red'&&!i.ackAt)?'flash':''}">
        ${lg(TYPES[i.type].t,'xl')}<div class="badges"><span class="tag">${tagText}</span>${cfBadge}</div></div>
      <div class="dr">${action}</div>
      <div class="tl">${row('sent', i.submittedAt)}${row('ack', i.ackAt)}${(i.attempts&&i.attempts.length)?row('rejected', i.attempts[i.attempts.length-1].at, `<div class="why">×${i.attempts.length}</div>`, true):''}${cfRow}${i.escalatedAt||i.qaAt?row('escalated', i.escalatedAt)+row('qa', i.qaAt, i.qaAt?`<div class="why ${i.qaDecision==='approved'?'qa-ok':'qa-no'}">${T[i.qaDecision==='approved'?'approved':'notapproved'][0]}</div>`:''):row('opfixed', i.opResolvedAt)+row('resolved', i.resolvedAt)}</div>
    </div>`;
}

function renderHistory(){
  const list = [...issues].sort((a,b) => b.submittedAt - a.submittedAt);
  const cards = list.map(i => {
    const resp = i.ackAt ? fmtDur(i.ackAt - i.submittedAt) : '—';
    const closeAt = i.resolvedAt || i.qaAt;
    const fix = closeAt ? fmtDur(closeAt - i.submittedAt) : '—';
    const st = i.cancelledAt ? 'Cancelled' : i.qaAt ? 'QA ' + (i.qaDecision === 'approved' ? 'Approved' : 'Not approved') : i.resolvedAt ? 'Resolved' : i.escalatedAt ? 'ESCALATED' : 'Open';
    return `<div class="hcard ${i.color}"><div class="t">${TYPES[i.type].t[0]}<span>${i.color.toUpperCase()} · ${st} · ${fmtDate(i.submittedAt)}</span></div>
      ${i.cantFixAt?`<div class="cfl">Can't fix (${fmtTime(i.cantFixAt)}): ${cfText(i)}</div>`:''}
      ${(i.attempts&&i.attempts.length)?`<div class="cfl">Packers said not fixed ×${i.attempts.length} (last ${fmtTime(i.attempts[i.attempts.length-1].at)})</div>`:''}
      ${i.escalatedAt?`<div class="cfl">Escalated ${fmtTime(i.escalatedAt)}${i.qaAt?` → QA ${i.qaDecision==='approved'?'APPROVED':'NOT APPROVED'} ${fmtTime(i.qaAt)}`:' – waiting for QA / Manager'}</div>`:''}
      <div class="g"><div>Sent<b>${fmtTime(i.submittedAt)}</b></div>
      <div>Op. confirmed<b>${fmtTime(i.ackAt)}</b><i>response ${resp}</i></div>
      <div>Op. fixed<b>${fmtTime(i.opResolvedAt)}</b><i>repair ${i.opResolvedAt&&i.ackAt?fmtDur(i.opResolvedAt-i.ackAt):'—'}</i></div>
      <div>Packers OK<b>${fmtTime(i.resolvedAt)}</b><i>total ${fix}</i></div></div></div>`;
  }).join('') || '<div class="empty">No issues logged yet</div>';
  return `<div class="head">${backBtn()}<div class="title">Issue Log <span class="vtag">v${APP_VERSION}</span></div></div>
    <div class="hbar"><button class="tbtn" data-act="csv">${ico('dl','cc')}Download CSV</button><button class="tbtn" data-act="clearlog" style="color:#ff9a9a">${ico('trash','cc')}Clear log</button></div>
    <div class="hist">${cards}</div>`;
}

function render(){
  const v = view.name;
  $('#app').innerHTML = v==='color' ? renderColor() : v==='detail' ? renderDetail() : v==='cant' ? renderCant() : v==='history' ? renderHistory() : renderHome();
}

/* ---------- modal ---------- */
function modal(html){ $('#overlay').innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`; }
function closeModal(){ $('#overlay').innerHTML = ''; }
const askModal = (q, noLbl, yesLbl, yesCls, yesAct, id, sub) => modal(`${lg(q,'xl')}${sub?`<div class="sub">${sub}</div>`:''}
  <div class="row"><button class="no" data-act="closemodal">${lg(noLbl,'md')}</button>
  <button class="${yesCls}" data-act="${yesAct}" data-id="${id}">${lg(yesLbl,'md')}</button></div>`);

/* ---------- actions ---------- */
function exportCsv(){
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const iso = ts => ts ? new Date(ts).toLocaleString() : '';
  const rows = [['Issue','Urgency','Status','Sent','Operator confirmed',"Can't fix time","Can't fix reason","Can't fix note",'Operator fixed','Packers confirmed resolved','Escalated time','QA decision','QA decision time','Not-fixed count','Last not-fixed time','Response (min)','Total (min)']];
  [...issues].sort((a,b)=>a.submittedAt-b.submittedAt).forEach(i => rows.push([
    TYPES[i.type].t[0], i.color, i.cancelledAt?'cancelled':i.qaAt?'qa-'+i.qaDecision:i.resolvedAt?'resolved':i.escalatedAt?'escalated':'open',
    iso(i.submittedAt), iso(i.ackAt), iso(i.cantFixAt), i.cantFixReason ? REASONS[i.cantFixReason].t[0] : '', i.cantFixNote || '',
    iso(i.opResolvedAt), iso(i.resolvedAt), iso(i.escalatedAt), i.qaDecision || '', iso(i.qaAt), (i.attempts||[]).length, (i.attempts&&i.attempts.length)?iso(i.attempts[i.attempts.length-1].at):'',
    i.ackAt ? ((i.ackAt-i.submittedAt)/60000).toFixed(1) : '',
    (i.resolvedAt||i.qaAt) ? (((i.resolvedAt||i.qaAt)-i.submittedAt)/60000).toFixed(1) : '']));
  const blob = new Blob([rows.map(r=>r.map(q).join(',')).join('\r\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'gluer-issue-log.csv'; document.body.appendChild(a); a.click(); a.remove();
}

async function updateApp(){
  toast('Checking for update…');
  try {
    const r = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    const latest = m ? m[1] : APP_VERSION;
    try { if ('caches' in window) (await caches.keys()).forEach(k => caches.delete(k)); } catch(e){}
    try { if (navigator.serviceWorker) (await navigator.serviceWorker.getRegistrations()).forEach(x => x.unregister()); } catch(e){}
    toast(latest !== APP_VERSION ? `Updating to v${latest}…` : `Already latest (v${APP_VERSION}) – reloading`);
    setTimeout(() => { location.href = location.pathname + '?v=' + Date.now(); }, 900);
  } catch(e){ toast('No internet – try again'); }
}

document.addEventListener('input', e => { if (e.target.id === 'note') view.note = e.target.value; });

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act){
    case 'home': view = {name:'home'}; render(); break;
    case 'history': view = {name:'history'}; render(); break;
    case 'update': updateApp(); break;
    case 'pick': view = {name:'color', type:b.dataset.type, color:null}; render(); break;
    case 'color': view.color = b.dataset.color; render(); break;
    case 'send':
      if (!view.color) return;
      issues.push({id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), type:view.type, color:view.color, submittedAt:Date.now(), ackAt:null, opResolvedAt:null, resolvedAt:null, cancelledAt:null});
      save(); view = {name:'home'}; render(); toast('Sent · Enviado · ပို့ပြီး'); break;
    case 'open': view = {name:'detail', id}; render(); break;
    case 'ack': { const i = byId(id); if (i && !i.ackAt){ i.ackAt = Date.now(); save(); render(); } break; }
    case 'askop': askModal(T.isfixed, T.notyet, T.yesfixed, 'yes', 'opres', id, 'Operator'); break;
    case 'opres': { const i = byId(id); if (i && i.ackAt && !i.opResolvedAt){ i.opResolvedAt = Date.now(); save(); } closeModal(); view = {name:'home'}; render(); toast('Packers: please confirm · confirmen · အတည်ပြုပါ'); break; }
    case 'askesc': askModal(T.escq, T.notyet, T.yesesc, 'yes', 'esc', id, 'Packers'); break;
    case 'esc': { const i = byId(id); if (i && i.cantFixAt && !i.escalatedAt){ i.escalatedAt = Date.now(); save(); } closeModal(); view = {name:'home'}; render(); toast('Escalated · Escalado · တင်ပြပြီး'); break; }
    case 'retry': { const i = byId(id); if (i && i.cantFixAt && !i.escalatedAt){ (i.cfHistory = i.cfHistory || []).push({at:i.cantFixAt, reason:i.cantFixReason, note:i.cantFixNote}); i.cantFixAt = null; i.cantFixReason = null; i.cantFixNote = ''; save(); render(); } break; }
    case 'askqa': { const ap = b.dataset.d === 'approved'; askModal(ap ? T.appq : T.nappq, T.notyet, ap ? T.yesapp : T.yesnapp, ap ? 'yes' : 'danger', ap ? 'qaok' : 'qano', id, 'QA / Manager'); break; }
    case 'qaok': case 'qano': { const i = byId(id); if (i && isEsc(i)){ i.qaAt = Date.now(); i.qaDecision = act === 'qaok' ? 'approved' : 'rejected'; save(); } closeModal(); view = {name:'home'}; render(); toast(act === 'qaok' ? 'Approved · Aprobado · ခွင့်ပြုသည်' : 'Not approved · No aprobado · ခွင့်မပြုပါ'); break; }
    case 'cantfix': view = {name:'cant', id, reason:null, note:''}; render(); break;
    case 'reason': view.reason = b.dataset.r; render(); { const n = $('#note'); if (n) n.focus(); } break;
    case 'sendcant': {
      const i = byId(view.id);
      if (i && view.reason){ i.cantFixAt = Date.now(); i.cantFixReason = view.reason; i.cantFixNote = view.reason === 'other' ? (view.note || '').trim() : ''; save(); }
      view = {name:'home'}; render(); toast("Can't fix recorded · No se puede arreglar · ပြင်၍ မရ"); break; }
    case 'asknot': askModal(T.notfixq, T.notyet, T.yesnotfix, 'danger', 'notfix', id, 'Packers'); break;
    case 'notfix': { const i = byId(id); if (i && i.opResolvedAt && !i.resolvedAt){ (i.attempts = i.attempts || []).push({opAt:i.opResolvedAt, at:Date.now()}); i.opResolvedAt = null; save(); } closeModal(); view = {name:'home'}; render(); toast('Back to operator · Vuelve al operador · အော်ပရေတာထံ ပြန်ပို့ပြီး'); break; }
    case 'askres': askModal(T.boxesgood, T.notyet, T.yesgood, 'yes', 'res', id, 'Packers'); break;
    case 'res': { const i = byId(id); if (i && i.opResolvedAt && !i.resolvedAt){ i.resolvedAt = Date.now(); save(); } closeModal(); view = {name:'home'}; render(); toast('Resolved · Resuelto · ဖြေရှင်းပြီး'); break; }
    case 'askcancel': askModal(T.cancelq, T.nokeep, T.yescancel, 'danger', 'cancel', id, 'Sent by mistake'); break;
    case 'cancel': { const i = byId(id); if (i && isOpen(i)){ i.cancelledAt = Date.now(); save(); } closeModal(); view = {name:'home'}; render(); break; }
    case 'closemodal': closeModal(); break;
    case 'csv': exportCsv(); break;
    case 'clearlog':
      modal(`<div class="big">Clear the whole log?</div><div class="sub">This deletes all saved issues on this tablet. Download the CSV first if you need it.</div>
        <div class="row"><button class="no" data-act="closemodal" style="font-size:calc(var(--vu)*3);font-weight:900">NO · KEEP</button><button class="danger" data-act="doclear" style="font-size:calc(var(--vu)*3);font-weight:900">YES, CLEAR</button></div>`); break;
    case 'doclear': issues = []; save(); closeModal(); render(); break;
  }
});


/* keep the tablet screen awake */
let wl = null;
async function keepAwake(){ try { if (navigator.wakeLock && !wl) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch(e){} }
document.addEventListener('pointerdown', keepAwake, {passive:true});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

render();
</script>
</body>
</html>
